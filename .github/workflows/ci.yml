name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  # The Intel macOS archive in the release is cross-compiled, so make sure it
  # still links here rather than finding out at tag time. The binary cannot be
  # run on an arm64 runner, hence building the tests instead of running them.
  cross-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: cargo test --no-run --locked --target x86_64-apple-darwin
      - name: The binary must really be x86_64
        run: |
          binary=target/x86_64-apple-darwin/release/sshrek
          file "$binary"
          lipo -archs "$binary" | grep -qw x86_64
