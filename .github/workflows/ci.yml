name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked
      - run: RUSTDOCFLAGS=-Dwarnings cargo doc --no-deps --locked

  # `rust-version` in Cargo.toml is a promise to everyone building from source,
  # and dependency updates are merged without a human looking. The version is
  # read from Cargo.toml so the two cannot drift apart.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked

  # The same hooks a contributor gets from `pre-commit install`, for the commits
  # that arrive without them. The cargo ones are skipped: the job above already
  # runs those, on two platforms.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: cargo-fmt,cargo-clippy

  # The Intel macOS archive in the release is cross-compiled, so make sure it
  # still links here rather than finding out at tag time. The binary cannot be
  # run on an arm64 runner, hence building the tests instead of running them.
  cross-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: cargo test --no-run --locked --target x86_64-apple-darwin
      - name: The binary must really be x86_64
        run: |
          binary=target/x86_64-apple-darwin/release/sshrek
          file "$binary"
          lipo -archs "$binary" | grep -qw x86_64
