name: release-please

# Keeps a release PR open that bumps Cargo.toml and CHANGELOG.md from the
# conventional commits landed since the last tag. Merging that PR is the
# release: release-please tags it and publishes the GitHub release, and the
# tag starts release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A personal token instead of GITHUB_TOKEN, for three reasons: a tag
      # pushed with GITHUB_TOKEN starts no workflow, so release.yml would never
      # run; pull requests it opens get no CI either; and it cannot tag a
      # commit that is no longer the head of main when workflow files changed
      # in between, which is all it takes for a Renovate automerge to land
      # right after the release PR.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
