name: release-please

# Keeps a release PR open that bumps Cargo.toml and CHANGELOG.md from the
# conventional commits landed since the last tag. Merging that PR is the
# release: release-please tags it and publishes the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # A tag pushed with GITHUB_TOKEN triggers no workflows, so the build is
  # called from here instead of waiting for release.yml to notice the tag.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
